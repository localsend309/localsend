<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Special ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INTRO -->
    <section id="intro" class="screen">

        <div class="intro-content">

            <p id="introText" class="intro-text"></p>

            <div id="lockArea" class="lock-area hidden">

    <p class="lock-message">
        I think there's something waiting for you...
    </p>

    <!-- PADLOCK -->
    <div id="lockButton" class="lock-button" aria-label="PIN Lock">

        <div class="lock-shackle"></div>

        <div class="lock-body">
            <div class="lock-keyhole"></div>
            <div class="lock-heart">♡</div>
        </div>

    </div>


    <!-- PIN DISPLAY -->
    <div id="pinDisplay" class="pin-display">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- NUMBER KEYPAD -->
    <div id="keypad" class="keypad">

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>

        <button class="empty-key"></button>
        <button data-number="0">0</button>
        <button id="deleteButton">⌫</button>

    </div>


    <!-- ANNIVERSARY HINT -->
    <p class="pin-hint">
        hint: <span>our anniversary ♡</span>
    </p>

    <p id="pinMessage" class="pin-message"></p>

</div>

        </div>

    </section>


    <!-- NEXT SECTION -->
    <section id="birthday" class="screen hidden-section">

        <div class="birthday-content">

            <p class="small-text">you unlocked it...</p>

            <h1>Happy Birthday ♡</h1>

            <p>
                But this is only the beginning.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
